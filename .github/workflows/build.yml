name: Build DEB
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl unzip build-essential fakeroot
      - name: Setup Theos
        run: |
          H="https://"
          G="github.com"
          git clone --recursive "${H}${G}/theos/theos.git" ~/theos
          curl -L "${H}${G}/theos/sdks/archive/refs/heads/master.zip" -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk ~/theos/sdks/
          curl -L "${H}${G}/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma" -o toolchain.tar.lzma
          mkdir -p ~/theos/toolchain/linux/iphone
          tar --lzma -xf toolchain.tar.lzma -C ~/theos/toolchain/linux/iphone --strip-components=1
      - name: Build Package
        run: |
          export THEOS=~/theos
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidSiri-deb
          path: packages/*.deb
