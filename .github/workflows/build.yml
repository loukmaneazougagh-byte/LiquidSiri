name: Build DEB
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: theos/theos
          submodules: recursive
          path: theos
      - uses: actions/checkout@v4
        with:
          repository: theos/sdks
          path: sdks
      - name: Setup Theos & ldid
        run: |
          mv theos ~/theos
          mv sdks/*.sdk ~/theos/sdks/
          H="https://"
          G="github.com"
          curl -sL "${H}${G}/ProcursusTeam/ldid/releases/latest/download/ldid_macos_x86_64" -o ~/theos/bin/ldid
          chmod +x ~/theos/bin/ldid
      - name: Build DEB
        run: |
          export THEOS=~/theos
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidSiri-deb
          path: packages/*.deb
