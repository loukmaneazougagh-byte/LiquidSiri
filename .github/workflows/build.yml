name: Build DEB
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: theos/theos
          submodules: recursive
          path: theos
      - uses: actions/checkout@v4
        with:
          repository: theos/sdks
          path: sdks
      - uses: actions/checkout@v4
        with:
          repository: ProcursusTeam/ldid
          path: ldid_src
      - name: Setup Theos & Build ldid
        run: |
          mv theos ~/theos
          mv sdks/*.sdk ~/theos/sdks/
          cd ldid_src && make && cp ldid ~/theos/bin/ldid
      - name: Build DEB
        run: |
          export THEOS=~/theos
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidSiri-deb
          path: packages/*.deb
