name: Build DEB
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl unzip build-essential fakeroot xz-utils zstd libtinfo5 libxml2-dev
      - name: Setup Theos
        run: |
          H="https://"
          G="://githubusercontent.com"
          curl -fsSL "${H}${G}/theos/theos/master/bin/install-theos" -o install.sh
          chmod +x install.sh
          printf "1\n1\n1\n" | ./install.sh
      - name: Build DEB
        run: |
          export THEOS=~/theos
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidSiri-deb
          path: packages/*.deb
