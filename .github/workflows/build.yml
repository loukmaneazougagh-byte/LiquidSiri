name: Build DEB
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          brew install ldid fakeroot
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Setup Theos
        run: |
          H="https://"
          G="github.com"
          git clone --recursive "${H}${G}/theos/theos.git" ~/theos
          curl -L "${H}${G}/theos/sdks/archive/refs/heads/master.zip" -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk ~/theos/sdks/
      - name: Build Package
        run: |
          export THEOS=~/theos
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidSiri-deb
          path: packages/*.deb
