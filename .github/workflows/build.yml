name: Build DEB
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos & ldid
        run: |
          H="https://"
          G="github.com"
          git clone --recursive "${H}${G}/theos/theos.git" ~/theos
          curl -L "${H}${G}/theos/sdks/archive/refs/heads/master.zip" -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk ~/theos/sdks/
          curl -L "${H}${G}/ProcursusTeam/ldid/releases/latest/download/ldid_macos_x86_64" -o ~/theos/bin/ldid || curl -L "${H}${G}/ProcursusTeam/ldid/releases/latest/download/ldid_macos_arm64" -o ~/theos/bin/ldid
          chmod +x ~/theos/bin/ldid
      - name: Build DEB
        run: |
          export THEOS=~/theos
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidSiri-deb
          path: packages/*.deb
