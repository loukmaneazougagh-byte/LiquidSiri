name: Build DEB
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl unzip build-essential fakeroot xz-utils libtinfo5 libxml2
      - name: Setup Theos
        run: |
          H="https://"
          G="github.com"
          git clone --recursive "${H}${G}/theos/theos.git" ~/theos
          curl -L "${H}${G}/theos/sdks/archive/refs/heads/master.zip" -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk ~/theos/sdks/
          TOOL_URL=$(curl -s "https://api.${G}/repos/CRKatri/llvm-project/releases/latest" | grep "browser_download_url.*linux-x86_64.tar.zst" | cut -d '"' -f 4)
          curl -L "$TOOL_URL" -o toolchain.tar.zst
          mkdir -p ~/theos/toolchain/linux/iphone
          tar --zstd -xf toolchain.tar.zst -C ~/theos/toolchain/linux/iphone --strip-components=1
      - name: Build DEB
        run: |
          export THEOS=~/theos
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidSiri-deb
          path: packages/*.deb
