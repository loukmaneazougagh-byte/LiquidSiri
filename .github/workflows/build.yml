name: Build DEB
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl unzip build-essential fakeroot xz-utils zstd libtinfo5 libxml2-dev
      - name: Setup Theos
        run: |
          H="https://"
          G="github.com"
          git clone --recursive "${H}${G}/theos/theos.git" ~/theos
          curl -L "${H}${G}/theos/sdks/archive/refs/heads/master.zip" -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk ~/theos/sdks/
          curl -L "${H}${G}/kabiroberai/swift-toolchain-linux/releases/download/v2.3.1/swift-5.8-ubuntu22.04.tar.xz" -o toolchain.tar.xz
          mkdir -p ~/theos/toolchain/linux/iphone
          tar -xf toolchain.tar.xz -C ~/theos/toolchain/linux/iphone --strip-components=1
          curl -L "${H}${G}/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64" -o ~/theos/bin/ldid
          chmod +x ~/theos/bin/ldid
      - name: Build DEB
        run: |
          export THEOS=~/theos
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidSiri-deb
          path: packages/*.deb
